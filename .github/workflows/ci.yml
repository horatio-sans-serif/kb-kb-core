name: CI

on:
  push:
    branches: [main]
  pull_request:

jobs:
  test:
    runs-on: ubuntu-latest # has a C toolchain for the cgo SQLite driver
    env:
      CGO_ENABLED: "1"
      GOFLAGS: "-tags=sqlite_fts5" # FTS5 search: build/test/vet all need the module
    steps:
      - uses: actions/checkout@v4
      - uses: actions/setup-go@v5
        with:
          go-version: "1.24"
      - name: gofmt
        run: test -z "$(gofmt -l .)" || { gofmt -l .; exit 1; }
      - name: vet
        run: go vet ./...
      - name: build
        run: go build ./...
      - name: test (race)
        run: go test -race ./...

  lint:
    runs-on: ubuntu-latest
    env:
      CGO_ENABLED: "1"
      GOFLAGS: "-tags=sqlite_fts5"
    steps:
      - uses: actions/checkout@v4
      - uses: actions/setup-go@v5
        with:
          go-version: "1.24"
      - uses: golangci/golangci-lint-action@v6
        with:
          version: v1.61.0
